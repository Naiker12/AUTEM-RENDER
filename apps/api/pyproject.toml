[project]
name = "autem-api"
version = "0.1.0"
description = "FastAPI backend for Autem Render"
requires-python = ">=3.12"
dependencies = [
    "autem-core",
    "autem-providers",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pillow>=11.0.0",
    "trimesh>=4.6.0",
    "numpy>=2.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.37",
    "alembic>=1.14.1",
    "psycopg[binary]>=3.2.4",
    "redis>=5.2.1",
    "celery>=5.4.0",
    "boto3>=1.36.0",
]

[tool.uv.sources]
autem-core = { workspace = true }
autem-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autem_api"]
