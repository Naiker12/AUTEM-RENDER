[project]
name = "autem-worker"
version = "0.1.0"
description = "Celery GPU/AI workers for Autem Render"
requires-python = ">=3.12"
dependencies = [
    "autem-core",
    "autem-providers",
    "celery>=5.4.0",
    "redis>=5.2.1",
]

[tool.uv.sources]
autem-core = { workspace = true }
autem-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autem_worker"]
