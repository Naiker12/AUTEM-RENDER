[project]
name = "autem-providers"
version = "0.1.0"
description = "Interchangeable AI model provider layer (local + API) for Autem Render"
requires-python = ">=3.12"
dependencies = [
    "autem-core",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "fal-client>=0.5.9",
    "pillow>=11.0.0",
    "trimesh>=4.6.0",
    "numpy>=2.2.0",
]

[tool.uv.sources]
autem-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autem_providers"]
