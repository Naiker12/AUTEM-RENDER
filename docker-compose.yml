# Autem Render — Docker Compose ligero (uso personal local: solo API + Web)
# Para worker GPU remoto con Redis/Celery usa: docker compose -f docker-compose.yml -f compose.gpu.yml up
services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: autem-api
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: "0.0.0.0"
      AUTEM_INLINE_JOBS: "true"
      AUTEM_DB_PATH: "/app/data/autem_render.db"
      AUTEM_STORAGE_DIR: "/app/data/storage"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: autem-web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
